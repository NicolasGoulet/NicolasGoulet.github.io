---
layout: default
---

{% include base_path %}

<div id="main" role="main">
  <main class="blog-index section-hub" aria-labelledby="hub-title">
    <header class="blog-index__header">
      <p class="blog-kicker">{{ page.kicker }}</p>
      <h1 id="hub-title">{{ page.title }}</h1>
    </header>

    {% if content != empty %}
      <div class="section-hub__intro">
        {{ content }}
      </div>
    {% endif %}

    <section class="blog-list" aria-label="{{ page.list_label }}">
      {% for item in page.hub_items %}
        <a class="blog-card" href="{{ base_path }}{{ item.url }}">
          <div class="blog-card__meta">
            <span>{{ item.meta }}</span>
          </div>
          <div class="blog-card__title">
            <p>{{ item.eyebrow }}</p>
            <h2>{{ item.title }}</h2>
            {% if item.description %}<span class="blog-card__description">{{ item.description }}</span>{% endif %}
          </div>
          <span class="blog-card__arrow" aria-hidden="true">→</span>
        </a>
      {% endfor %}
    </section>
  </main>
</div>
